# The browser lane's own configuration (#613). Its runner is the
# `browser` dependency group alone (Playwright and pytest), so the
# checkout's configuration in pyproject.toml, which names plugins that
# environment does not carry, is not read, and neither is the conftest
# above this directory, which imports the server. `run.sh` passes this
# file with `-c`.
[pytest]
addopts = -p no:cacheprovider
filterwarnings =
    error
