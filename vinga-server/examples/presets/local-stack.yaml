# A whole deployment that runs on this host and reaches no vendor:
# local transcription, a local model behind an OpenAI-shaped endpoint, a
# local voice, and the endpointer that runs on every audio frame anyway.
# One document, written in one transaction and then installed on the
# running server:
#
#   vinga import -f examples/presets/local-stack.yaml
#   vinga apply
#
# The import orders the writes for you. A write whose references do not
# resolve is refused, and a document is refused whole rather than half
# written, so there is no creation order to get right here: the
# providers and the defaults naming them arrive together. Importing is
# additive and never deletes, so a section this document does not name
# is left alone and the same document twice changes nothing. Nothing
# the import wrote is serving until the apply behind it installs it.
#
# Nothing here holds a credential. A keyless local runner needs none,
# and an endpoint that authenticates names the variable holding its key
# with `api_key_env`; the models refuse anything else.
#
# There are deliberately no agents, no devices and no default agent
# below. The first agent a deployment has is vinga, the agent built
# into the server: it runs on the providers and defaults this document
# writes, and it answers what the board in front of you can do and how
# vinga's parts fit together. Which board talks to which agent is the
# one thing a preset cannot know. A board nobody has bound shows a
# six-digit code, and `vinga device pending claim` with that code
# binds it to the default agent, which is vinga until you set another
# with `vinga default-agent set`. Or bind a board by the MAC on its
# sticker:
#
#   vinga device bind aa:bb:cc:dd:ee:ff vinga
#
# Your own agents are a document or a command each
# (examples/agent.yaml), and a board bound to one of them still reaches
# vinga beside it.
#
# Every field below is documented in docs/reference/domain-config.md,
# and examples/ holds a commented fragment per provider type with the
# measured numbers behind each default.

providers:
  llm:
    # Any endpoint that speaks the OpenAI chat completions API: Ollama,
    # llama.cpp, vLLM. From inside the container image the host is not
    # localhost, so point this at host.docker.internal there.
    local:
      type: openai_compatible
      base_url: http://localhost:11434/v1
      # Gemma 4 e4b, the local model measured best for vinga's own
      # questions; docs/run/llm.md has the numbers, and what its first
      # turn costs on small hardware.
      model: gemma4:e4b
      # Sent to Ollama with every request: answer without streaming the
      # model's thinking first, which it otherwise does before every
      # reply.
      reasoning_effort: none
      # openai_compatible cannot know its own reach, since base_url
      # decides it. `host` is the operator asserting the endpoint is on
      # this machine, which is what a server.data_boundary of host asks
      # for.
      reach: host

  asr:
    # Weights download at the first start, so that boot takes minutes
    # and later ones seconds.
    whisper:
      type: faster_whisper
      model: small
      # Cuts both latency and hallucinations on silence-padded
      # utterances.
      vad_filter: true

  tts:
    # A voice is a provider entry, so two agents that should sound
    # different name two entries. Voice names come from the Piper
    # collection and download at the first start.
    voice:
      type: piper
      voice: en_US-lessac-medium

  vad:
    ears:
      type: silero

# What every agent uses unless it names something else, vinga included
# unless a builtin_agent entry names its own. A prompt is deliberately
# not here: a prompt is what makes an agent that agent.
agent_defaults:
  llm: local
  asr: whisper
  tts: voice
  vad: ears
