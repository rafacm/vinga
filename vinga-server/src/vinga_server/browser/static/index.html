<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="vinga-socket" content="{{socket}}">
<title>vinga</title>
<link rel="stylesheet" href="{{assets}}/page.css">
<script type="module" src="{{assets}}/page.js"></script>
</head>
<body>
<main>
<h1>vinga</h1>
<p id="status" role="status">Loading.</p>
<p id="no-interrupt" hidden>This browser cannot cancel its own echo, so speaking over a reply does not interrupt it. Wait for the reply to finish, or press Interrupt.</p>
<p id="code" class="code" hidden></p>
<div id="pair" hidden>
<label for="onboarding">Onboarding URL</label>
<input id="onboarding" type="url" autocomplete="off" spellcheck="false">
<button id="join" type="button">Join</button>
</div>
<div class="controls">
<button id="start" type="button" hidden>Start</button>
<button id="interrupt" type="button" hidden>Interrupt</button>
<button id="end" type="button" hidden>End</button>
<span id="volume"></span>
</div>
<ol id="transcript"></ol>
</main>
</body>
</html>
